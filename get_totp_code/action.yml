name: 'Secrets Safe Get TOTP Code Action'
author: 'BeyondTrust Corporation'
description: 'This custom action retrieves the current TOTP one-time code of a TOTP-enabled credential secret from an instance of Secrets Safe.'
inputs:
  api_key:
    description: 'The API Key configured in BeyondInsight for your application. If not set, then client credentials must be provided.'
    required: false
    default: ''
  api_version:
    description: 'API version. Defaults to 3.3, the version that adds TOTP support for credential secrets.'
    required: false
    default: '3.3'
  client_id:
    description: 'The API OAuth Client ID is configured in BeyondInsight for your application. For use when authenticating to Secrets Safe'
    required: false
    default: ''
  client_secret:
    description: 'The API OAuth Client Secret is configured in BeyondInsight for your application. For use when authenticating to Secrets Safe.'
    required: false
    default: ''
  api_url:
    description: 'The API URL for the Secrets Safe instance from which to request a TOTP code.'
    required: true
    default: ''
  verify_ca:
    description: 'Indicates whether to verify the certificate authority on the Secrets Safe instance. Accepts true, false, or the path to a CA bundle inside the action container (the workspace is mounted at /github/workspace). true verifies against certifi bundled roots, not the OS trust store. For use when authenticating to Secrets Safe.'
    required: false
    default: 'true'
  certificate:
    description: 'Content of the certificate (cert.pem) for use when authenticating with an API key using a Client Certificate.'
    required: false
    default: ''
  certificate_key:
    description: 'Certificate private key (key.pem). For use when authenticating with an API key using a Client Certificate.'
    required: false
    default: ''
  secret_id:
    description: 'ID (GUID) of the TOTP-enabled credential secret whose current TOTP code is retrieved. For example, a1b2c3d4-e5f6-7890-abcd-ef1234567890.'
    required: true
    default: ''
  log_level:
    description: 'Log level'
    required: false
    default: 'INFO'
outputs:
  totp_code:
    description: 'The current TOTP code of the secret, read as steps.<step_id>.outputs.totp_code. It is masked in the logs and is only valid for the current TOTP period, so use it in the next step.'
  valid_from_utc:
    description: 'UTC time from which the code is valid (inclusive), as returned by the API, e.g. 2026-11-13T10:00:00.0000000+00:00. Not masked.'
  valid_to_utc:
    description: 'UTC time at which the code expires (exclusive), as returned by the API, e.g. 2026-11-13T10:00:30.0000000+00:00. Not masked.'
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    API_KEY: ${{ inputs.api_key }}
    API_VERSION: ${{ inputs.api_version }}
    CLIENT_ID: ${{ inputs.client_id }}
    CLIENT_SECRET: ${{ inputs.client_secret }}
    API_URL: ${{ inputs.api_url }}
    VERIFY_CA: ${{ inputs.verify_ca }}
    CERTIFICATE: ${{ inputs.certificate }}
    CERTIFICATE_KEY: ${{ inputs.certificate_key }}
    LOG_LEVEL: ${{ inputs.log_level }}
branding:
  icon: 'lock'
  color: 'orange'
