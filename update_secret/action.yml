name: 'Secrets Safe Update Secret Action'
author: 'BeyondTrust Corporation'
description: 'This custom action allows for the update of an existing credential, text or file secret in Secrets Safe API.'
inputs:
  api_key:
    description: 'The API Key configured in BeyondInsight for your application. If not set, then client credentials must be provided.'
    required: false
    default: ''
  api_version:
    description: 'Supported versions are 3.0, 3.1, 3.2 and 3.3. The recommended version is 3.1. If no version is specified, the default API version 3.0 will be used. Use 3.3 to change TOTP on credential secrets.'
    required: false
    default: ''
  client_id:
    description: 'The API OAuth Client ID is configured in BeyondInsight for your application. For use when authenticating to Secrets Safe'
    required: false
    default: ''
  client_secret:
    description: 'The API OAuth Client Secret is configured in BeyondInsight for your application. For use when authenticating to Secrets Safe.'
    required: false
    default: ''
  api_url:
    description: 'The API URL for the Secrets Safe instance in which to update a secret.'
    required: true
    default: ''
  verify_ca:
    description: 'Indicates whether to verify the certificate authority on the Secrets Safe instance. Accepts true, false, or the path to a CA bundle inside the action container (the workspace is mounted at /github/workspace). true verifies against certifi bundled roots, not the OS trust store. For use when authenticating to Secrets Safe.'
    required: false
    default: 'true'
  certificate:
    description: 'Content of the certificate (cert.pem) for use when authenticating with an API key using a Client Certificate.'
    required: false
    default: ''
  certificate_key:
    description: 'Certificate private key (key.pem). For use when authenticating with an API key using a Client Certificate.'
    required: false
    default: ''
  log_level:
    description: 'Log level'
    required: false
    default: 'INFO'
  secret_id:
    description: 'ID (GUID) of the secret to update. The secret is read first, so it stays in its folder and its type is checked. The type cannot change: set username for a credential secret, text for a text secret, or file_name and file_content for a file secret.'
    required: true
    default: ''
  secret_title:
    description: 'Title of the secret. Left empty, the current title is kept.'
    required: false
    default: ''
  secret_description:
    description: 'Description of the secret. Left empty, the current description is kept.'
    required: false
    default: ''
  username:
    description: 'Username for credential type secrets. Required to update a credential secret.'
    required: false
    default: ''
  password:
    description: 'Password for credential type secrets. Left empty, the current password is kept. Masked in the logs.'
    required: false
    default: ''
  text:
    description: 'Text content for text type secrets. Required to update a text secret (it cannot be read back). Masked in the logs.'
    required: false
    default: ''
  file_content:
    description: 'File content for file type secrets. Required with file_name to update a file secret (it cannot be read back).'
    required: false
    default: ''
  file_name:
    description: 'File name for file type secrets'
    required: false
    default: ''
  owner_id:
    description: 'ID of the owner for the secret (API 3.0). Left empty, the current value is kept.'
    required: false
    default: ''
  owner_type:
    description: 'Type of the owner (User or Group). Left empty, the current value is kept.'
    required: false
    default: ''
  owners:
    description: |
      List of owners for the secret (in JSON format). Left empty, the current owners are kept. Example:
      `[{"user_id":123}]` for API 3.1+, `[{"owner_id":123}]` for API 3.0
    required: false
    default: ''
  password_rule_id:
    description: 'Password rule ID for credential secrets. Left empty, the current rule is kept.'
    required: false
    default: ''
  notes:
    description: 'Additional notes for the secret. Left empty, the current notes are kept.'
    required: false
    default: ''
  urls:
    description: |
      URLs associated with the secret (in JSON format). Left empty, the current URLs are kept. Example:
      `[{"url":"https://example.com"}]`
    required: false
    default: ''
  totp_enabled:
    description: 'TOTP on a credential secret (api_version 3.3). true sets or replaces the seed given in totp_secret_key, false turns TOTP off, and empty leaves the current TOTP setting unchanged.'
    required: false
    default: ''
  totp_secret_key:
    description: 'TOTP seed for credential secrets, as a Base32 string or an otpauth:// URI (max 1024 characters). Only allowed when totp_enabled is true. Pass it from a GitHub secret. It is masked in the logs and never returned by the API.'
    required: false
    default: ''
runs:
  using: 'docker'
  image: 'Dockerfile'
  env:
    API_KEY: ${{ inputs.api_key }}
    API_VERSION: ${{ inputs.api_version }}
    CLIENT_ID: ${{ inputs.client_id }}
    CLIENT_SECRET: ${{ inputs.client_secret }}
    API_URL: ${{ inputs.api_url }}
    VERIFY_CA: ${{ inputs.verify_ca }}
    CERTIFICATE: ${{ inputs.certificate }}
    CERTIFICATE_KEY: ${{ inputs.certificate_key }}
    LOG_LEVEL: ${{ inputs.log_level }}
branding:
  icon: 'lock'
  color: 'orange'
